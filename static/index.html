<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5WHY — AI Analiza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/chat.css">
<link rel="stylesheet" href="/static/diagram.css">
</head>
<body>

<div class="layout">

  <div class="container">
    <div class="header">
      <div class="header-icon">AI</div>
      <div class="header-text">
        <h1>5WHY Klepetalnik</h1>
      </div>
      <button id="export-btn" onclick="exportPDF()" style="display:none;">
        ⬇ Izvozi PDF
      </button>
    </div>
    <div class="messages" id="messages">
      <div class="welcome">Pozdravljeni.<br>Sem specializiran AI asistent za 5WHY analizo.<br><br>Opišite težavo ali naložite PDF dokument<br>in začeli bomo analizo temeljnih vzrokov.</div>
    </div>
    <div class="input-area">
      <label for="pdf-input" class="pdf-label" id="pdf-label" title="Naloži PDF">📎</label>
      <input type="file" id="pdf-input" accept=".pdf" style="display:none">
      <span class="pdf-badge" id="pdf-badge"></span>
      <textarea id="user-input" placeholder="Napišite sporočilo..." rows="1"></textarea>
      <button class="clear-btn" onclick="clearChat()" title="Počisti pogovor">↺</button>
      <button id="send-btn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 8l12-6-5 6 5 6-12-6z" fill="white"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="diagram-panel" id="diagram-panel">
    <div class="diagram-header">5WHY Diagram</div>
    <div class="diagram-content" id="diagram-content">
      <div class="diagram-empty">Diagram se bo<br>generiral med analizo...</div>
    </div>
  </div>

</div>

<script src="/static/diagram.js"></script>
<script src="/static/export.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>
