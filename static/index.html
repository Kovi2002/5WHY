<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Klepetalnik</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }

  .container {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #e0e0db;
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    height: 90vh;
    max-height: 750px;
    overflow: hidden;
  }

  .header {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid #e0e0db;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    width: 36px;
    height: 36px;
    background: #1a1a1a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .header-text h1 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .header-text p { font-size: 12px; color: #888; margin-top: 1px; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 85%;
  }

  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.assistant { align-self: flex-start; align-items: flex-start; }

  .message-label {
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .message-bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    color: #1a1a1a;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.user .message-bubble {
    background: #1a1a1a;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.assistant .message-bubble {
    background: #f5f5f3;
    border: 1px solid #e0e0db;
    border-bottom-left-radius: 4px;
  }

  .message.error .message-bubble {
    background: #fff0f0;
    border: 1px solid #ffc0c0;
    color: #c0392b;
  }

  .typing {
    display: flex;
    gap: 5px;
    padding: 12px 14px;
    background: #f5f5f3;
    border: 1px solid #e0e0db;
    border-radius: 12px;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
  }

  .typing span {
    width: 7px; height: 7px;
    background: #aaa;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .welcome {
    text-align: center;
    padding: 2rem 1rem;
    color: #aaa;
    font-size: 14px;
    line-height: 1.7;
  }

  .input-area {
    border-top: 1px solid #e0e0db;
    padding: 1rem 1.5rem;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #user-input {
    flex: 1;
    border: 1px solid #d0d0cc;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: system-ui, sans-serif;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.15s;
    color: #1a1a1a;
    background: #fff;
  }
  #user-input:focus { border-color: #888; }

  #send-btn {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #send-btn:hover { background: #333; }
  #send-btn:disabled { background: #ccc; cursor: default; }

  .clear-btn {
    font-size: 18px;
    color: #ccc;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 2px;
    align-self: center;
    flex-shrink: 0;
    line-height: 1;
  }
  .clear-btn:hover { color: #888; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-icon">AI</div>
    <div class="header-text">
      <h1>AI Klepetalnik</h1>
      <p>Powered by Claude</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome">Zdravo! Sem AI asistent.<br>Napišite vprašanje in odgovoril vam bom.</div>
  </div>

  <div class="input-area">
    <textarea id="user-input" placeholder="Napišite sporočilo..." rows="1"></textarea>
    <button class="clear-btn" onclick="clearChat()" title="Počisti pogovor">↺</button>
    <button id="send-btn" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 8l12-6-5 6 5 6-12-6z" fill="white"/>
      </svg>
    </button>
  </div>
</div>

<script>
  let history = [];

  document.getElementById("user-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById("user-input").addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  function addMessage(role, text) {
    const msgs = document.getElementById("messages");
    const welcome = msgs.querySelector(".welcome");
    if (welcome) welcome.remove();

    const div = document.createElement("div");
    div.className = `message ${role}`;

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = role === "user" ? "Vi" : role === "error" ? "Napaka" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    bubble.textContent = text;

    div.appendChild(label);
    div.appendChild(bubble);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById("messages");
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing-indicator";
    el.innerHTML = "<span></span><span></span><span></span>";
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    input.value = "";
    input.style.height = "auto";

    addMessage("user", text);
    history.push({ role: "user", content: text });
    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();

      if (data.error) throw new Error(data.error);

      history.push({ role: "assistant", content: data.reply });
      hideTyping();
      addMessage("assistant", data.reply);

    } catch (err) {
      hideTyping();
      history.pop();
      addMessage("error", "Napaka: " + err.message);
    }

    btn.disabled = false;
    input.focus();
  }

  function clearChat() {
    history = [];
    const msgs = document.getElementById("messages");
    msgs.innerHTML = '<div class="welcome">Pogovor počiščen. Napišite novo vprašanje.</div>';
  }
</script>

</body>
</html>
